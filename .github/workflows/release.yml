name: Release

# Publishes packages on `v*.*.*` tag push via nuget.org Trusted Publishing (OIDC).
# Setup: docs/nuget-trusted-publishing-setup.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token used by NuGet/login@v1
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts

      - name: Login to NuGet (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          # Repo secret NUGET_USER = nuget.org profile name (NOT email).
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        run: dotnet nuget push './artifacts/*.nupkg' --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
