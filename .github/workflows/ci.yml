name: CI

# Public repository: standard GitHub-hosted runners are free and unlimited,
# windows-latest and macos-latest included, so cost never justifies narrowing
# the matrix. Larger runners are billed even here.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, stacked]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Validation scope for this branch dispatch'
        required: false
        default: 'full'
        type: choice
        options: [full, subset]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-plan:
    name: Validation plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Resolve validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          REQUESTED_SCOPE: ${{ inputs.validation_scope || '' }}
          DRAFT_MODE: ${{ vars.CI_DRAFT_MODE || 'ready-only' }}
        run: |
          scope=full
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then scope="$REQUESTED_SCOPE"; fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_DRAFT" = "true" ]; then scope="$DRAFT_MODE"; fi
          case "$scope" in full|subset|ready-only) ;; *) exit 1 ;; esac
          if [ "$scope" = "subset" ]; then scope=full; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Lint workflows
        # A plain YAML parse accepts an invalid workflow; only an Actions-aware
        # linter rejects one. Waivers live in .github/actionlint.yaml.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Validate guidance structure
        shell: pwsh
        run: ./scripts/Test-GuidanceStructure.ps1

  build-and-test:
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: NuGet cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts

      - name: Verify TUnit assertions package
        shell: pwsh
        run: ./scripts/Verify-TUnitAssertionsPackage.ps1 -PackageDirectory ./artifacts

      - name: Verify strongly typed UUIDv7 package
        shell: pwsh
        run: ./scripts/Verify-StronglyTypedIdsPackage.ps1 -PackageDirectory ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

  ci:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft CI' || 'CI' }}
    needs: [validation-plan, build-and-test]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check validation results
        env:
          SCOPE: ${{ needs.validation-plan.outputs.scope }}
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then exit 1; fi
          if [ "$BUILD_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "cancelled" ]; then exit 1; fi
          if [ "$SCOPE" = "full" ] && [ "$BUILD_RESULT" != "success" ]; then exit 1; fi
